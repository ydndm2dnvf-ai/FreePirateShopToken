<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FREE TOKEN – QR-Code</title>
  <style>
    :root { --gold: #8d5c20; --deep-gold: #59351d; --red-gold: #572c26; --cream: #f5e6bd; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden;
      font-family: Arial, Helvetica, sans-serif; color: var(--cream);
      background: radial-gradient(ellipse at 50% 35%, #bd8738 0%, #966024 44%, #68401f 100%);
      position: relative;
    }
    /* Low-contrast decorative token medallions in the background. */
    body::before {
      content: ""; position: fixed; inset: -10%; pointer-events: none; opacity: .25;
      background-image:
        radial-gradient(circle, transparent 0 25px, var(--red-gold) 26px 29px, transparent 30px 34px, var(--red-gold) 35px 37px, transparent 38px),
        radial-gradient(circle, transparent 0 16px, #4d3021 17px 19px, transparent 20px 24px, #4d3021 25px 27px, transparent 28px);
      background-size: 210px 210px, 160px 160px;
      background-position: 0 0, 80px 95px;
      transform: rotate(-12deg) scale(1.1);
    }
    .poster {
      position: relative; z-index: 1; width: min(92vw, 520px); padding: 30px 26px 32px;
      text-align: center; border: 2px solid rgba(244, 205, 119, .55); border-radius: 28px;
      background: linear-gradient(145deg, rgba(69, 41, 25, .94), rgba(103, 58, 31, .94));
      box-shadow: 0 24px 70px rgba(31, 16, 8, .55), inset 0 0 0 7px rgba(190, 133, 53, .13);
    }
    h1 { margin: 0 0 22px; font-size: clamp(2rem, 8vw, 3.4rem); letter-spacing: .16em; color: #e8c47b; text-shadow: 0 3px 0 #44261b; }
    .qr-frame {
      position: relative; width: min(70vw, 340px); aspect-ratio: 1; margin: auto;
      padding: 13px; border-radius: 18px; background: #f4e7c7;
      box-shadow: 0 0 0 5px #9b6b2e, 0 12px 30px rgba(0,0,0,.4);
    }
    .qr { display: block; width: 100%; height: 100%; border-radius: 7px; }
    .logo {
      position: absolute; width: 24%; aspect-ratio: 1; left: 50%; top: 50%; transform: translate(-50%, -50%);
      display: grid; place-items: center; border-radius: 22%; background: #f4e7c7;
      box-shadow: 0 0 0 5px #f4e7c7, 0 2px 8px rgba(0,0,0,.35);
    }
    .logo svg { width: 100%; height: 100%; }
    .caption { margin: 25px 0 0; color: #e8c47b; font-size: clamp(1.6rem, 6vw, 2.5rem); font-weight: 900; letter-spacing: .24em; text-shadow: 0 3px 0 #44261b; }
    .hint { margin: 10px 0 0; color: #d7c49c; font-size: .95rem; letter-spacing: .04em; }
    @media (prefers-reduced-motion: no-preference) {
      .poster { animation: arrive .7s ease-out both; }
      @keyframes arrive { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
    }
  </style>
</head>
<body>
  <main class="poster">
    <h1>SCAN ME</h1>
    <div class="qr-frame" aria-label="QR-Code zur Pirate Shop Token Website">
      <img class="qr" alt="QR-Code zur Pirate Shop Token Website"
        src="https://api.qrserver.com/v1/create-qr-code/?size=600x600&amp;ecc=H&amp;margin=2&amp;data=https%3A%2F%2Fydndm2dnvf-ai.github.io%2FFreePirateShopToken%2F">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="coin" cx="30%" cy="25%"><stop stop-color="#f9e6a3"/><stop offset=".55" stop-color="#bd8738"/><stop offset="1" stop-color="#59351d"/></radialGradient>
            <linearGradient id="ring" x2="1" y2="1"><stop stop-color="#f8dfa0"/><stop offset=".5" stop-color="#a56b28"/><stop offset="1" stop-color="#59351d"/></linearGradient>
          </defs>
          <g fill="url(#ring)" stroke="#59351d" stroke-width="1.5" stroke-linejoin="round">
            <path d="M50 2 58 31 50 38 42 31Z"/><path d="m98 50-29 8-7-8 7-8Z"/><path d="m50 98-8-29 8-7 8 7Z"/><path d="M2 50 31 42l7 8-7 8Z"/>
          </g>
          <circle cx="50" cy="50" r="32" fill="none" stroke="url(#ring)" stroke-width="6"/>
          <circle cx="50" cy="50" r="24" fill="url(#coin)" stroke="#59351d" stroke-width="1.5"/>
          <path d="M40 36h22v7H47v6h13v7H47v15h-7Z" fill="#fff8e6" stroke="#6b4d2c" stroke-width=".7"/>
        </svg>
      </div>
    </div>
    <p class="caption">FREE TOKEN</p>
    <p class="hint">Scanne den QR-Code und öffne die Website</p>
  </main>
</body>
</html>
