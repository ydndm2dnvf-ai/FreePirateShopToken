<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pirate Shop Token</title>
  <style>
    :root {
      --gold-1: #fce38a;
      --gold-2: #f4c95d;
      --gold-3: #d89c1d;
      --gold-4: #8a5a15;
      --gold-5: #5c3407;
      --ink: #22170a;
      --white: #ffffff;
      --soft: #f7f1dd;
      --shadow: rgba(47, 25, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, var(--gold-2) 0%, var(--gold-3) 30%, var(--gold-4) 100%);
      color: var(--ink);
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .screen {
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      position: relative;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .screen.hidden {
      opacity: 0;
      transform: scale(0.98);
      pointer-events: none;
      position: absolute;
      inset: 0;
    }

    .start-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
      padding: 24px;
    }

    .token {
      width: min(62vw, 300px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 25%, #fff6c5 0%, var(--gold-1) 18%, var(--gold-2) 30%, var(--gold-3) 56%, var(--gold-4) 100%);
      border: 10px double rgba(78, 45, 0, 0.65);
      box-shadow:
        inset 0 0 0 10px rgba(255,255,255,0.18),
        0 22px 55px var(--shadow),
        0 0 0 8px rgba(255, 235, 162, 0.26);
      position: relative;
      display: grid;
      place-items: center;
      animation: float 3.4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    .token::before {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      border: 4px solid rgba(89, 53, 10, 0.18);
    }

    .token::after {
      content: "";
      position: absolute;
      inset: 34px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.22);
    }

    .token-svg {
      width: 58%;
      height: 58%;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 3px 2px rgba(22, 8, 0, 0.22));
    }

    .title {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #3d2408;
      text-shadow: 0 2px 0 rgba(255,255,255,0.18);
    }

    .button {
      border: none;
      background: linear-gradient(180deg, #fff3c3 0%, #f0c85a 100%);
      color: var(--ink);
      font-size: clamp(1rem, 2.5vw, 1.6rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 18px 36px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 12px 22px rgba(76, 45, 0, 0.22);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .button:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 16px 26px rgba(76, 45, 0, 0.28);
    }

    .button:active {
      transform: translateY(1px) scale(0.99);
    }

    .white-screen {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      background: white;
      color: black;
      text-align: center;
      padding: 24px;
    }

    .white-screen.show {
      display: grid;
    }

    .white-screen h2 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 7rem);
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="screen" id="goldScreen">
    <div class="start-wrap">
      <div class="token" aria-label="Pirate Shop Token" role="img">
        <svg class="token-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="50" cy="50" r="43" fill="none" stroke="#6a430d" stroke-width="2" opacity="0.8"/>
          <path d="M50 10 58 42 90 50 58 58 50 90 42 58 10 50 42 42Z" fill="#6a430d" opacity="0.9"/>
          <path d="M50 20 55 45 80 50 55 55 50 80 45 55 20 50 45 45Z" fill="#fff7d1"/>
          <circle cx="50" cy="50" r="7" fill="#6a430d"/>
        </svg>
      </div>

      <h1 class="title">Pirate Shop</h1>
      <button class="button" id="startBtn">Starten</button>
    </div>
  </div>

  <div class="white-screen" id="whiteScreen" aria-live="polite">
    <h2>LECK MEINE EIER</h2>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const goldScreen = document.getElementById('goldScreen');
    const whiteScreen = document.getElementById('whiteScreen');

    startBtn.addEventListener('click', () => {
      goldScreen.classList.add('hidden');
      whiteScreen.classList.add('show');
    });
  </script>
</body>
</html>
