<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pirate Shop Token</title>
  <style>
    :root {
      --gold-1: #fce38a;
      --gold-2: #f4c95d;
      --gold-3: #d89c1d;
      --gold-4: #8a5a15;
      --ink: #22170a;
      --shadow: rgba(47, 25, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, var(--gold-2) 0%, var(--gold-3) 30%, var(--gold-4) 100%);
      color: var(--ink);
    }

    body { display: grid; place-items: center; overflow: hidden; }

    .screen {
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      position: relative;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .screen.hidden {
      opacity: 0;
      transform: scale(0.98);
      pointer-events: none;
      position: absolute;
      inset: 0;
    }

    .start-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
      padding: 24px;
    }

    .token {
      width: min(72vw, 340px);
      aspect-ratio: 1;
      position: relative;
      display: grid;
      place-items: center;
      animation: float 3.4s ease-in-out infinite;
      filter: drop-shadow(0 22px 24px var(--shadow));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .token-svg { width: 100%; height: 100%; overflow: visible; }

    .title {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #3d2408;
      text-shadow: 0 2px 0 rgba(255,255,255,0.18);
    }

    .button {
      border: none;
      background: linear-gradient(180deg, #fff3c3 0%, #f0c85a 100%);
      color: var(--ink);
      font-size: clamp(1rem, 2.5vw, 1.6rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 18px 36px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 12px 22px rgba(76, 45, 0, 0.22);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .button:hover { transform: translateY(-2px) scale(1.01); box-shadow: 0 16px 26px rgba(76, 45, 0, 0.28); }
    .button:active { transform: translateY(1px) scale(0.99); }

    .white-screen {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      background: white;
      color: black;
      text-align: center;
      padding: 24px;
    }

    .white-screen.show { display: grid; }
    .white-screen h2 { margin: 0; font-size: clamp(2.5rem, 8vw, 7rem); line-height: 1; font-weight: 900; letter-spacing: 0.04em; }

    @media (prefers-reduced-motion: reduce) {
      .token { animation: none; }
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="screen" id="goldScreen">
    <div class="start-wrap">
      <div class="token" aria-label="Goldener Piraten-Kompass-Token mit weißem F" role="img">
        <svg class="token-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fff4bf"/>
              <stop offset=".2" stop-color="#e9b94e"/>
              <stop offset=".48" stop-color="#fff0a4"/>
              <stop offset=".72" stop-color="#a96814"/>
              <stop offset="1" stop-color="#ffe38a"/>
            </linearGradient>
            <radialGradient id="orb" cx="32%" cy="24%" r="78%">
              <stop offset="0" stop-color="#fffde0"/>
              <stop offset=".23" stop-color="#ffe68a"/>
              <stop offset=".58" stop-color="#e8ad35"/>
              <stop offset=".84" stop-color="#b87319"/>
              <stop offset="1" stop-color="#70400d"/>
            </radialGradient>
            <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff"/>
              <stop offset=".55" stop-color="#f5f2e7"/>
              <stop offset="1" stop-color="#c9c4b8"/>
            </linearGradient>
            <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur in="SourceAlpha" stdDeviation="1.7" result="blur"/>
              <feOffset dy="2" result="offset"/>
              <feComponentTransfer><feFuncA type="linear" slope=".38"/></feComponentTransfer>
              <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>

          <!-- Compass points sit behind the outer metal ring. -->
          <g fill="url(#metal)" stroke="#75450f" stroke-width="2.2" stroke-linejoin="round">
            <path d="M100 4 111 53 100 66 89 53Z"/>
            <path d="M196 100 147 111 134 100 147 89Z"/>
            <path d="M100 196 89 147 100 134 111 147Z"/>
            <path d="M4 100 53 89 66 100 53 111Z"/>
            <path d="M34 34 71 65 73 77 61 75Z" opacity=".9"/>
            <path d="M166 34 139 73 127 75 129 63Z" opacity=".9"/>
            <path d="M166 166 129 135 127 123 139 125Z" opacity=".9"/>
            <path d="M34 166 61 127 73 125 71 137Z" opacity=".9"/>
          </g>

          <!-- Circular frame, intentionally interrupted at the lower-left. -->
          <circle cx="100" cy="100" r="66" fill="none" stroke="#63390d" stroke-width="12" stroke-dasharray="91 8 103 8 91 113" transform="rotate(-90 100 100)"/>
          <circle cx="100" cy="100" r="66" fill="none" stroke="url(#metal)" stroke-width="8" stroke-dasharray="91 8 103 8 91 113" transform="rotate(-90 100 100)"/>
          <circle cx="100" cy="100" r="57" fill="none" stroke="#fff0ae" stroke-width="1.7" opacity=".8" stroke-dasharray="2 3"/>

          <!-- Two separate gold fragments at the lower-left ring opening. -->
          <path d="m40 137 9 5-7 11-8-4Z" fill="url(#metal)" stroke="#75450f" stroke-width="2" stroke-linejoin="round"/>
          <path d="m48 149 14 8-11 7-9-5Z" fill="url(#metal)" stroke="#75450f" stroke-width="2" stroke-linejoin="round"/>

          <!-- Glossy central gold sphere and its single white F. -->
          <circle cx="100" cy="100" r="42" fill="#63390d" opacity=".38" transform="translate(0 3)"/>
          <circle cx="100" cy="98" r="42" fill="url(#orb)" stroke="#805013" stroke-width="2.5" filter="url(#softShadow)"/>
          <ellipse cx="86" cy="77" rx="17" ry="8" fill="#fff" opacity=".36" transform="rotate(-32 86 77)"/>
          <path d="M85 72h36v11H98v10h20v11H98v25H85Z" fill="url(#letter)" stroke="#8a7448" stroke-width="1.2" stroke-linejoin="round" filter="url(#softShadow)"/>
          <path d="M87 74h31" stroke="#fff" stroke-width="1.2" opacity=".8"/>
        </svg>
      </div>

      <h1 class="title">Pirate Shop</h1>
      <button class="button" id="startBtn">Starten</button>
    </div>
  </div>

  <div class="white-screen" id="whiteScreen" aria-live="polite">
    <h2>LECK MEINE EIER</h2>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const goldScreen = document.getElementById('goldScreen');
    const whiteScreen = document.getElementById('whiteScreen');

    startBtn.addEventListener('click', () => {
      goldScreen.classList.add('hidden');
      whiteScreen.classList.add('show');
    });
  </script>
</body>
</html>
